name = "gigiolab-form"
main = "worker.js"
compatibility_date = "2026-08-26"

# Origens autorizadas a chamar o endpoint (allow-list de CORS).
# Ajuste se um dia trocar o host ou adicionar staging.
[vars]
ALLOWED_ORIGINS = "https://gigiolab.dev,https://www.gigiolab.dev,http://localhost:4173"
TO_EMAIL = "geovane@gigiolab.dev"
TO_NAME = "Geovane Júnior"
FROM_EMAIL = "contato@gigiolab.dev"
FROM_NAME = "Contato GigioLAB"

# KV pra rate limiting por IP. O `id` precisa ser preenchido depois de rodar:
#   wrangler kv namespace create RATE_LIMIT
# O comando devolve o id — cola aqui e re-deploy.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_APOS_wrangler_kv_namespace_create"

# Custom domain (form.gigiolab.dev) fica DESATIVADO por enquanto — exige
# que o zone do gigiolab.dev esteja na Cloudflare. Como o DNS mora na
# Hostinger, o endpoint acessível é o .workers.dev direto:
#   https://gigiolab-form.<subdominio-da-conta>.workers.dev
# Se um dia migrar o DNS pra Cloudflare, descomente as 3 linhas abaixo:
#
# [[routes]]
# pattern = "form.gigiolab.dev/*"
# custom_domain = true
